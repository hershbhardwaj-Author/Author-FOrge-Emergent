<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="The Author's Forge — Electric Cohort" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&family=Inter+Tight:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
        <title>The Author's Forge — Electric Cohort</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    <script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.querySelector('form');
  if (!form) return;
  
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = form.querySelector('button[type="submit"]');
    var originalText = btn ? btn.textContent : 'Submit';
    if (btn) btn.textContent = 'Sending...';
    
    var data = {};
    form.querySelectorAll('input, textarea, select').forEach(function(el) {
      if (el.name) data[el.name] = el.value;
    });
    
    try {
      await fetch('https://little-morning-4803.hersh-bhardwaj.workers.dev/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      form.innerHTML = '<p style="color:green; font-size:18px; text-align:center;">Application sent! We will be in touch.</p>';
    } catch(err) {
      if (btn) btn.textContent = originalText;
      alert('Failed to send. Please try again.');
    }
  });
});
</script>
    </body>
</html>
